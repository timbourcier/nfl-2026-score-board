<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* graphite base with a faint green cast: dark, but not black and not navy */
  --bg:#12171A;--surface:#1A2126;--raised:#242D33;
  --red:#C4394A;--red2:#8F2634;              /* muted crimson, used sparingly */
  --accent:#12897C;--teal:#00565F;           /* midnight green does the structural work */
  --text:#EDF1F3;--muted:#95A3AB;--dim:#68757D;--good:#3FBF7F;--bad:#E0736F;
  --line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.045);
  --nav:calc(58px + env(safe-area-inset-bottom));
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{padding-bottom:var(--nav)}
h1,h2{margin:0;font-weight:700}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select{font:inherit}
.tabnum{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.hrow{display:flex;align-items:center;gap:10px}
.bar{width:4px;height:26px;background:var(--accent);border-radius:2px;flex:0 0 auto}
.htitle{font-size:17px;line-height:1.15;letter-spacing:-.01em}
.hsub{font-size:11px;color:var(--muted);margin-top:3px}
.hrec{margin-left:auto;display:flex;gap:18px;text-align:right}
.hrec b{font-size:19px;display:block;line-height:1}
.hrec span{font-size:10px;color:var(--muted);display:block;margin-top:3px}
main{padding:14px 14px 30px;max-width:980px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 2px 8px;font-size:10px;color:var(--muted);display:flex;
  flex-direction:column;align-items:center;gap:4px;min-height:52px;justify-content:center}
nav button .ic{width:20px;height:20px}
nav button.on{color:#fff}
nav button.on .ic{color:var(--red)}
.sec{display:flex;align-items:center;gap:8px;margin:22px 0 10px}
.sec i{width:3px;height:15px;background:var(--accent);border-radius:2px;flex:0 0 auto}
.sec h2{font-size:14px}
.note{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.empty{font-size:13px;color:var(--dim);padding:8px 0}
.seg{display:flex;gap:4px;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:14px}
.seg button{flex:1;font-size:12px;font-weight:700;padding:10px 4px;border-radius:7px;color:var(--muted);min-height:42px}
.seg button.on{background:var(--red);color:#fff}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.ghost{display:flex;align-items:center;justify-content:center;width:100%;text-align:center;
  background:var(--red);border:1px solid var(--red);color:#fff;font-weight:700;
  border-radius:10px;padding:13px;font-size:13px;min-height:46px}
.ghost.quiet{background:var(--raised);border-color:var(--line);color:var(--text);font-weight:600}
.linkbtn{font-size:12px;color:var(--muted);text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);
  color:#fff;font-size:13px;font-weight:700;border-radius:10px;padding:12px 16px;min-height:46px}
.btn.alt{background:var(--raised);border:1px solid var(--line);flex:0 0 auto}
.btn.sm{padding:8px 12px;min-height:36px;font-size:12px;border-radius:8px}
.loadrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--dim)}
.hero{background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:18px;margin-bottom:6px}
.hero .big{font-size:44px;line-height:1;font-weight:700}
.hero .lbl{font-size:12px;color:rgba(255,255,255,.72)}
.hero .sm{font-size:11px;color:rgba(255,255,255,.55);margin-top:5px}
.lockbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:11px 14px;border-radius:9px;background:var(--red);color:#fff;min-height:44px}
.lockbtn.is{background:transparent;border:1px solid rgba(255,255,255,.4)}
select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);
  border-radius:9px;padding:12px;min-height:46px;font-size:14px}
.game{padding:8px 0;border-bottom:1px solid var(--line2)}
.game:last-child{border-bottom:none}
.glabel{font-size:12px;color:var(--dim);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.gbtns{display:flex;align-items:center;gap:8px}
.tb{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;
  border-radius:10px;border:1px solid var(--line);padding:0 8px;font-size:14px;font-weight:700}
.tb.on{background:var(--c);border-color:var(--c);color:#fff}
.tb .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:0 0 auto;box-shadow:0 0 0 1px var(--line)}
.tb.on .dot{display:none}
.tb .sc{font-size:13px;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums}
.at{font-size:11px;color:var(--dim);flex:0 0 auto}
.res{width:20px;flex:0 0 auto;text-align:center;font-size:14px;font-weight:700}
.live{font-size:10px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:1px 5px}
.final{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.dhd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);
  background:var(--raised)}
.dhd::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:2px;flex:0 0 auto}
.dhd h3{margin:0;font-size:14px;font-weight:700}
.dhd .cnt{margin-left:auto;font-size:12px;color:var(--dim)}
.trow2{border-bottom:1px solid var(--line2)}
.trow2:last-child{border-bottom:none}
.thd{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;text-align:left;min-height:54px}
.thd .nm{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thd .pg{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.thd .rc{font-size:17px;font-weight:700;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.thd .cv{color:var(--dim);font-size:12px;width:12px;flex:0 0 auto}
.seed{font-size:11px;font-weight:700;border-radius:5px;padding:3px 7px;background:var(--raised);flex:0 0 auto}
.seed.d{background:var(--teal)}
.dot9{width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px var(--line)}
.gwrap{padding:2px 14px 10px;background:var(--bg)}
.prog{display:flex;align-items:center;gap:14px;background:var(--raised);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:12px}
.prog .n{font-size:22px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.prog .l{font-size:12px;color:var(--muted)}
.track{flex:1;height:7px;border-radius:4px;background:var(--bg);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .2s}
.brkscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;margin:0 -14px;padding-left:14px;padding-right:14px}
.brk{position:relative;height:546px;width:632px}
.bcol{position:absolute;top:0;font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.01em}
.mbox{position:absolute;width:176px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.mbox .rd{font-size:10px;color:var(--dim);padding:4px 9px;border-bottom:1px solid var(--line2)}
.mrow{display:flex;align-items:center;gap:8px;width:100%;padding:10px 9px;text-align:left;min-height:42px}
.mrow+.mrow{border-top:1px solid var(--line2)}
.mrow.on{background:var(--c);color:#fff}
.mrow .nm{flex:1;font-size:13px;font-weight:700}
.mrow .sd{font-size:10px;color:var(--dim)}
.mrow.on .sd{color:rgba(255,255,255,.85)}
.ln{position:absolute;background:var(--line)}
.byebox{position:absolute;width:176px;height:46px;border:1px solid var(--line);border-radius:10px;
  background:var(--raised);padding:0 11px;display:flex;align-items:center;gap:8px}
.sb{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.ring{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:16px;margin-bottom:10px}
.ring svg{flex:0 0 auto}
.ring .pc{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ring .cap{font-size:13px;color:var(--muted);margin-top:4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;margin:2px 0 14px}
@media (min-width:720px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{border-top:1px solid var(--line);padding:11px 0}
.kpi .l{font-size:11px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--dim)}
.dbar{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.dbar:last-child{border-bottom:none}
.dbar .nm{width:82px;flex:0 0 auto;font-size:12px;color:var(--muted)}
.dbar .tr{flex:1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.dbar .tr i{display:block;height:100%;border-radius:4px}
.dbar .vv{width:52px;text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.phead{display:flex;align-items:center;gap:11px;padding:12px;border-bottom:1px solid var(--line)}
.pid{flex:1;min-width:0}
.pname,.ppos,.slabel{background:none;border:none;border-bottom:1px solid transparent;outline:none;
  width:100%;padding:2px 0;border-radius:0}
.pname{font-size:16px;font-weight:700;color:var(--text)}
.ppos{font-size:11px;color:var(--muted)}
.pname:focus,.ppos:focus,.slabel:focus{border-bottom-color:var(--accent)}
.xbtn{width:34px;height:34px;border-radius:8px;color:var(--dim);flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;font-size:15px}
.xbtn:active{background:var(--raised);color:var(--text)}
.srow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2)}
.srow:last-of-type{border-bottom:none}
.slabel{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.slabel:focus{color:var(--text)}
.sval{width:84px;flex:0 0 auto;text-align:center;-moz-text-align-last:center;text-align-last:center;background:var(--bg);color:var(--text);
  border:1px solid var(--line);border-radius:9px;padding:9px 6px;font-size:15px;font-weight:600;
  min-height:42px;outline:none;font-variant-numeric:tabular-nums}
.sval:focus{border-color:var(--accent);background:rgba(18,137,124,.12)}
.sval::placeholder{color:var(--dim);text-align:center}
.sval::-webkit-outer-spin-button,.sval::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sval[type=number]{-moz-appearance:textfield}
.padd{display:block;width:100%;text-align:left;padding:12px;font-size:13px;color:var(--red);font-weight:600;min-height:44px}
.gz{padding:12px;border-bottom:1px solid var(--line2)}
.gz:last-child{border-bottom:none}
.gztop{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.gzlab{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.gzpct{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.gzbar{position:relative;height:12px;border-radius:6px;background:var(--bg)}
.gzbar i{position:absolute;left:0;top:0;height:100%;border-radius:6px;transition:width .2s}
.gzmark{position:absolute;top:-3px;width:2px;height:18px;background:rgba(255,255,255,.75);border-radius:1px}
.gzfoot{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px}
.gzin{display:flex;align-items:center;gap:10px;margin-top:10px}
.wkpick{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px 12px;padding:0 14px 4px}
.wkpick button{flex:0 0 auto;min-width:46px;min-height:44px;border-radius:10px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);padding:0 10px}
.wkpick button.po{min-width:52px;color:var(--muted)}
.wkpick button.on{background:var(--red);border-color:var(--red);color:#fff}
.wkpick button.done{color:var(--text)}

[data-skin="broadcast"] .thd{border-left:4px solid var(--tc,transparent);padding-left:10px}
[data-skin="broadcast"] .thd .rc{font-size:21px;letter-spacing:-.02em}

// the next calendar day. The NFL never plays Tue/Wed/Fri, so a date falling on

// Week 1's Wednesday opener is the single exception and is corrected by hand.
(function correctDates(){
 const SHIFT={1:1,2:1,5:1};            // Mon, Tue, Fri -> pull back a day
 for(const id in GDATE){
  const p=GDATE[id].split('-').map(Number);
  const y=p[0]>=8?2026:2027;

  if(SHIFT[d.getUTCDay()]){
   d.setUTCDate(d.getUTCDate()-1);
   GDATE[id]=String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
  }
 }
 if(GDATE['NE@SEA']==='09-10') GDATE['NE@SEA']='09-09';   // Wednesday season opener

 const order=win.slice().sort(cmp).concat(rest.sort(cmp).slice(0,3));

  div=[{id:'divA',home:by[1],away:rk[2]},{id:'divB',home:rk[0],away:rk[1]}];}

/* Live schedule + scores. Supplies the week groupings the NFL opponents table
   lacks, plus live scores. Falls back to manual entry if the call fails. */
const ESPN_FIX={WSH:'WAS',LA:'LAR',JAC:'JAX',ARZ:'ARI'};
const fixAbbr=a=>{a=(a||'').toUpperCase();return ESPN_FIX[a]||a;};
// Sources tried in order. /api/schedule is the Vercel proxy: same origin, so
// no CORS and nothing for an ad blocker to match. The direct ESPN calls are
// there for local dev without the proxy.
const SOURCES=(n,ty)=>[
 {u:'/api/schedule?week='+n+'&type='+ty,slim:true},
 {u:'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=2026&seasontype='+ty+'&week='+n},
 {u:'https://cdn.espn.com/core/nfl/schedule?xhr=1&year=2026&seasontype='+ty+'&week='+n}];
async function fetchWeek(n,ty){
 ty=ty||2;
 let last='no response';
 for(const src of SOURCES(n,ty)){
  try{
   const r=await fetch(src.u,{cache:'no-store'});
   if(!r.ok){last='HTTP '+r.status;continue;}
   const j=await r.json();
   if(src.slim){
    if(j&&j.games&&j.games.length)return ty===3?j.games:j.games.filter(g=>GAME_BY_ID[g.id]);
    last=(j&&j.error)||'proxy returned nothing';continue;
   }
   let events=j.events;
   if(!events&&j.content&&j.content.schedule){
    events=[];
    for(const day in j.content.schedule) events=events.concat(j.content.schedule[day].games||[]);
   }
   const got=parseEvents(events,ty);
   if(got.length)return got;
   last='no games parsed';
  }catch(e){ last=(e&&e.message)||'network error'; }
 }
 throw new Error(last);
}
function parseEvents(events,ty){
 const out=[];
 for(const ev of(events||[])){
  const c=(ev.competitions||[])[0];if(!c)continue;
  const cs=c.competitors||[];
  const H=cs.find(x=>x.homeAway==='home'),A=cs.find(x=>x.homeAway==='away');
  if(!H||!A)continue;
  const home=fixAbbr(H.team&&H.team.abbreviation),away=fixAbbr(A.team&&A.team.abbreviation);
  const id=away+'@'+home;if(ty!==3&&!GAME_BY_ID[id])continue;
  const st=((c.status||{}).type)||{};
  const as=H.score===undefined?null:Number(A.score),hs=H.score===undefined?null:Number(H.score);
  let winner=null;
  if(st.completed){if(as>hs)winner=away;else if(hs>as)winner=home;}
  out.push({id,away,home,state:st.state||'pre',detail:st.shortDetail||'',as,hs,winner});}
 return out;}

/* ================= bracket drawing ================= */
function bracketHTML(conf,seeds,br,bp,mode){
 // Boxes are 102px tall, so rows sit 128px apart to leave a clear 26px gap.
 // Each divisional box is centred between the two boxes feeding it, and the
 // championship between the two divisionals, so the connectors run straight.
 const W=176,GAP=52,ROW=128,BOX=102,BYE=46;
 const c0=0,c1=W+GAP,c2=2*(W+GAP);
 const tops={bye:34,wcA:ROW+13,wcB:2*ROW+13,wcC:3*ROW+13};
 const mid={bye:tops.bye+BYE/2,wcA:tops.wcA+BOX/2,wcB:tops.wcB+BOX/2,wcC:tops.wcC+BOX/2};
 mid.divA=(mid.bye+mid.wcA)/2; mid.divB=(mid.wcB+mid.wcC)/2;
 mid.conf=(mid.divA+mid.divB)/2;
 mid.divA=Math.round(mid.divA); mid.divB=Math.round(mid.divB); mid.conf=Math.round(mid.conf);
 tops.divA=mid.divA-BOX/2; tops.divB=mid.divB-BOX/2; tops.conf=mid.conf-BOX/2;
 const box=(m,round,top,x)=>{
  const w=bp[conf+'.'+m.id];
  const row=t=>t?'<button class="mrow'+(w===t?' on':'')+'" style="--c:'+col(t)+'" data-a="'+mode+'" data-k="'+conf+'.'+m.id+'" data-t="'+t+'">'
    +dot(t)+'<span class="nm">'+t+'</span>'+(seeds[t]?'<span class="sd">#'+seeds[t]+'</span>':'')+'</button>'
   :'<div class="mrow"><span class="nm" style="color:var(--dim)">TBD</span></div>';
  return'<div class="mbox" style="left:'+x+'px;top:'+top+'px"><div class="rd">'+round+'</div>'+row(m.away)+row(m.home)+'</div>';};
 const line=(x,y,w,h)=>'<div class="ln" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px"></div>';
 const elbow=(y1,y2,ym,xs)=>{const xm=xs+GAP/2;
  return line(xs,y1,GAP/2,1)+line(xs,y2,GAP/2,1)+line(xm,Math.min(y1,y2),1,Math.abs(y2-y1))+line(xm,ym,GAP/2,1);};
 let h='<div class="brkscroll"><div class="brk">'
  +'<div class="bcol" style="left:'+c0+'px">Wild card</div>'
  +'<div class="bcol" style="left:'+c1+'px">Divisional</div>'
  +'<div class="bcol" style="left:'+c2+'px">'+conf+' title</div>'
  +elbow(mid.bye,mid.wcA,mid.divA,c0+W)
  +elbow(mid.wcB,mid.wcC,mid.divB,c0+W)
  +elbow(mid.divA,mid.divB,mid.conf,c1+W);
 const one=br.by[1];
 h+='<div class="byebox" style="left:'+c0+'px;top:'+tops.bye+'px">'
  +(one?dot(one)+'<span style="font-size:13px;font-weight:700;flex:1">'+one+'</span><span style="font-size:10px;color:var(--dim)">#1 bye</span>'
    :'<span style="font-size:13px;color:var(--dim)">#1 seed, TBD</span>')+'</div>';
 ['wcA','wcB','wcC'].forEach((k,i)=>h+=box(br.wc[i],'Wild card',tops[k],c0));
 ['divA','divB'].forEach((k,i)=>h+=box(br.div[i],'Divisional',tops[k],c1));
 h+=box(br.conf,conf+' Championship',tops.conf,c2);
 return h+'</div></div>';}

function bracketAcc(store){
 const keys=Object.keys(S.actualBracketPicks).filter(k=>S.actualBracketPicks[k]);

 return {n:graded.length,right:graded.filter(k=>store[k]===S.actualBracketPicks[k]).length};

// Preseason and weekly are scored the same way; only the game set differs.
function perfRings(only){
 const P=accuracy(S.picks,only),W=accuracy(S.weekly,only);
 let verdict='Nothing graded yet';
 if(P.pct!==null&&W.pct!==null){
  if(W.pct>P.pct) verdict='Weekly ahead by '+(W.pct-P.pct)+' point'+(W.pct-P.pct===1?'':'s');
  else if(P.pct>W.pct) verdict='Preseason ahead by '+(P.pct-W.pct)+' point'+(P.pct-W.pct===1?'':'s');
  else verdict='Level';}
 return '<div class="vs">'+ringCard(P.pct,'Preseason',P.right+' of '+P.n)
  +ringCard(W.pct,'Weekly',W.right+' of '+W.n)+'</div>'
  +'<div class="card"><div style="font-size:13px">'+verdict+'</div></div>';
}

const TABS=[
 ['eagles','Eagles','M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z'],
 ['week','Weekly','M3 9h18M7 3v4m10-4v4M4 5h16v16H4z'],
 ['pre','Preseason','M3 6h18M3 12h18M3 18h12'],
 ['results','Results','M4 19V9m5 10V5m5 14v-7m5 7V7']];
// How far the season has actually got, from the calendar rather than from what
// has been entered. A game counts once its date has passed.
function gamesElapsed(now){
 now=now||Date.now();
 let n=0;
 for(const g of ALL_GAMES){
  const dt=gameDate(g.id);
  if(dt&&now>=dt.getTime()+24*3600*1000) n++;
 }
 return n;
}
// Two numbers that hold on every tab: how often your latest call on a game turned
// out right, and how much of the season has been played.
// "Latest call" is the weekly pick when there is one, otherwise the preseason pick.
function headerRecord(){
 let graded=0,right=0;
 for(const g of ALL_GAMES){
  const ac=S.actuals[g.id]; if(!ac) continue;
  const call=S.weekly[g.id]||S.picks[g.id]; if(!call) continue;
  graded++; if(call===ac) right++;
 }
 document.getElementById('hacc').textContent=graded?Math.round(right/graded*100)+'%':'0%';
 document.getElementById('hdone').textContent=Math.round(gamesElapsed()/272*100)+'%';
}
function render(){
 recompute();
 headerRecord();
 document.getElementById('app').innerHTML=
  UI.tab==='pre'?tabPreseason():UI.tab==='week'?tabWeek()
  :UI.tab==='results'?tabResults():tabEagles();
 document.getElementById('nav').innerHTML=TABS.map(t=>
  '<button class="'+(UI.tab===t[0]?'on':'')+'" data-a="tab" data-v="'+t[0]+'">'
  +'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+t[2]+'"/></svg>'
  +t[1]+'</button>').join('');
 updateGauges();
}

 if(a==='conf'){UI.conf=v;UI.team=null;return render();}
 if(a==='team'){UI.team=UI.team===v?null:v;return render();}
 if(a==='week'){UI.week=/^[0-9]+$/.test(v)?Number(v):v;UI.msg='';return render();}
 if(a==='pick'){if(locked)return;S.picks[el.dataset.g]=t;save();
  if(UI.tab==='pre'&&UI.sub.pre==='games')return patchPick(el.dataset.g,'pick');
  return render();}
 if(a==='wpick'){const wn=WEEK_OF[el.dataset.g];if(wn&&isWeekLocked(wn))return;
  S.weekly[el.dataset.g]=t;save();return render();}
 if(a==='actual'){
  if(t) S.actuals[el.dataset.g]=t; else delete S.actuals[el.dataset.g];
  save();return render();}
 if(a==='wbpick'){S.weeklyBracket[el.dataset.k]=t;save();return render();}
 if(a==='bpick'){if(locked)return;S.bracketPicks[el.dataset.k]=t;save();return render();}
 if(a==='abpick'){S.actualBracketPicks[el.dataset.k]=t;save();return render();}
 if(a==='lock'){if(Date.now()>=LOCK_AT)return;S.locked=!S.locked;save();return render();}
 if(a==='syncweek'){if(!UI.fetching)syncWeeks([Number(v)]);return;}
 if(a==='syncpo'){
  if(UI.fetching)return;

// A pick moves only a few numbers, so patch them instead of rebuilding the page
// and destroying the button under the finger.
function patchPick(gid,mode){
 recompute();
 const store=mode==='pick'?S.picks:mode==='wpick'?S.weekly:S.actuals;
 const rec=mode==='actual'?AREC:REC,g=GAME_BY_ID[gid],win=store[gid];
 document.querySelectorAll('[data-a="'+mode+'"][data-g="'+gid+'"]').forEach(b=>b.classList.toggle('on',b.dataset.t===win));
 if(mode!=='wpick'){[g.home,g.away].forEach(tm=>{
  document.querySelectorAll('.thd[data-v="'+tm+'"]').forEach(hd=>{
   const r=hd.querySelector('.rc'),c=hd.querySelector('.pg');
   if(r)r.textContent=rec[tm].w+'-'+rec[tm].l;
   if(c)c.textContent=GAMES_BY_TEAM[tm].filter(x=>store[x.id]).length+'/17';});});}
 const seeds=mode==='actual'?ASEED:SEED;
 const anyConf={NFC:false,AFC:false};
 DIVISIONS.forEach(d=>d.teams.forEach(tm=>{if(rec[tm].played>0)anyConf[d.conf]=true;}));
 document.querySelectorAll('[data-seed]').forEach(sp=>{
  const tm=sp.dataset.seed,cf=CONF_OF[tm];
  const sd=anyConf[cf]?seeds[cf].seeds[tm]:null;
  if(sd){sp.textContent=sd;sp.style.display='';sp.className='seed'+(sd<=4?' d':'');}
  else{sp.style.display='none';sp.textContent='';}});
 document.querySelectorAll('.dcard').forEach(card=>{
  const cnt=card.querySelector('.dhd .cnt');if(!cnt)return;
  let tot=0;card.querySelectorAll('.thd').forEach(hd=>{
   tot+=GAMES_BY_TEAM[hd.dataset.v].filter(x=>store[x.id]).length;});
  cnt.textContent=tot+' picks';});
 const n=Object.keys(S.picks).length;
 headerRecord();
 const hero=document.querySelector('.hero .big'),hsm=document.querySelector('.hero .sm');
 if(hero)hero.textContent=REC.PHI.w+'-'+REC.PHI.l;
 if(hsm)hsm.textContent=REC.PHI.played+' of 17 games picked';
 refreshSummary();}

function refreshSummary(){
 const p=document.querySelector('.prog');if(!p)return;
 if(UI.tab==='pre'){
  const n=Object.keys(S.picks).length,ns=p.querySelectorAll('.n');
  ns[0].textContent=Math.round(n/272*100)+'%';
  if(ns[1])ns[1].textContent=n;
  p.querySelector('.track i').style.width=(n/272*100)+'%';
 }else if(UI.tab==='week'&&!isRound(UI.week)){
  const games=weekGames(UI.week),picked=games.filter(g=>S.weekly[g.id]).length;
  p.querySelector('.n').textContent=picked+'/'+games.length;
  p.querySelector('.track i').style.width=(games.length?picked/games.length*100:0)+'%';}}

document.addEventListener('input',e=>{
 const el=e.target.closest('[data-i]');if(!el)return;
 const path=el.dataset.i.split('.');let o=S;
 for(let i=0;i<path.length-1;i++){if(o[path[i]]===undefined)o[path[i]]={};o=o[path[i]];}
 o[path[path.length-1]]=el.value;save();
 if(path[0]==='playerActuals'||path[0]==='throughWeek')updateGauges();});

function updateGauges(){
 const gp=Number(S.throughWeek)||0;
 for(const p of S.players){const a=S.playerActuals[p.id]||{};
  for(const st of p.stats){
   const bar=document.getElementById('b-'+p.id+'-'+st.k);if(!bar)continue;
   const pred=Number(st.v)||0,act=Number(a[st.k])||0;
   const pct=pred>0?Math.round(act/pred*100):0,scale=Math.max(100,pct);
   const cl=pct>=100?'var(--good)':'var(--red)';
   bar.style.width=(scale?Math.min(100,pct/scale*100):0)+'%';
   bar.style.background=cl;
   const mk=document.getElementById('m-'+p.id+'-'+st.k);if(mk)mk.style.left=(scale?100/scale*100:100)+'%';
   const q=document.getElementById('q-'+p.id+'-'+st.k);
   if(q){q.textContent=pred?pct+'%':'';q.style.color=pred?cl:'var(--dim)';}
   const f=document.getElementById('f-'+p.id+'-'+st.k);if(f)f.textContent=pred?act+' of '+pred:String(act);
   const pc=document.getElementById('p-'+p.id+'-'+st.k);if(pc)pc.textContent=gp>0?'On pace for '+Math.round(act/gp*17):'';}}}

// Pull the live scores for the current week (and the one before, to catch
// stragglers) whenever the app is opened and the last try is over 10 minutes old.
function autoSync(){
 if(location.protocol==='file:') return;              // browsers block the call there
 if(Date.now()-Number(S.lastSync||0) < 10*60*1000) return;
 const list=weeksNeedingResults(4);
 const regularOver=gamesElapsed()>=272;
 if(!list.length&&!regularOver) return;               // nothing outstanding
 S.lastSync=Date.now();
 if(list.length) syncWeeks(list,true);
 if(regularOver) syncPlayoffs(true).then(r=>{if(r.applied)render();});
}
